const COIN_STYLE = {BTC:["#f7931a","₿"], ETH:["#627eea","Ξ"], USDT:["#26a17b","₮"], USDC:["#2775ca","$"], DAI:["#f5ac37","◈"], FDUSD:["#3a3a3a","$"], SOL:["#9945ff","◎"], BNB:["#e0a800","B"], XRP:["#3a434b","X"], DOGE:["#c2a633","Ð"], ADA:["#0033ad","₳"], TRX:["#d9001b","T"], TON:["#0098ea","T"], AVAX:["#e84142","A"], DOT:["#e6007a","●"], LTC:["#345d9d","Ł"], BCH:["#0ac18e","B"], XLM:["#14b6e7","✦"], XMR:["#ff6600","M"], ETC:["#3ab83a","E"], LINK:["#2a5ada","⬡"], SUI:["#4da2ff","S"], APT:["#2d2d2d","A"], NEAR:["#00c08b","N"], ICP:["#3b00b9","∞"], HBAR:["#222222","ℏ"], FIL:["#0090ff","F"], ATOM:["#2e3148","⚛"], KAS:["#49eacb","K"], STX:["#5546ff","S"], ARB:["#28a0f0","A"], OP:["#ff0420","O"], POL:["#8247e5","P"], MATIC:["#8247e5","M"], IMX:["#0d0d2b","I"], UNI:["#ff007a","U"], AAVE:["#9c64d0","A"], MKR:["#1aab9b","M"], LDO:["#f69988","L"], CRV:["#3466c4","C"], PENDLE:["#1e4ba0","P"], ONDO:["#1c3c8c","O"], ENA:["#4b4b55","E"], HYPE:["#2bb3a3","H"], ASTER:["#c08b52","A"], JUP:["#2fb37f","J"], RUNE:["#00ccff","R"], INJ:["#0082fa","I"], SEI:["#9e1f19","S"], TIA:["#7b2bf9","T"], TAO:["#2d2d2d","τ"], FET:["#1e2943","F"], RENDER:["#e2382c","R"], WLD:["#333333","W"], PEPE:["#3d9a3d","P"], SHIB:["#e42d04","S"], WIF:["#b98a5e","W"], BONK:["#f4a12c","B"], FLOKI:["#e9a23b","F"], TRUMP:["#c9a227","T"], VIRTUAL:["#3ac0c8","V"], CRO:["#103f68","C"], OKB:["#2d2d2d","O"], BGB:["#00b8c4","B"], LEO:["#eb7b1d","L"], ZEC:["#f4b728","ⓩ"], WLFI:["#b8952e","W"], XPL:["#1f6feb","X"], PUMP:["#5fcb85","P"], PENGU:["#4a90e2","P"], S:["#2b2b2b","S"], ALGO:["#2b2b2b","A"], VET:["#15bdff","V"], EGLD:["#23f7dd","E"], SAND:["#00adef","S"], MANA:["#ff2d55","M"], AXS:["#0055d5","A"], GALA:["#1d1d1d","G"], APE:["#0054f9","A"], BLUR:["#ff6b00","B"], NOT:["#2d2d2d","N"], DOGS:["#2d2d2d","D"], W:["#2d2d2d","W"], ZRO:["#2d2d2d","Z"], STRK:["#ec796b","S"], MOVE:["#2d2d2d","M"], BERA:["#814625","B"], IP:["#2d2d2d","I"], KAITO:["#2ba3a3","K"]};
const coinKey = sym => { const r = String(sym || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); return COIN_ALIAS[r] || r; };
function coinBadge(sym, i, icon){
  if (icon) return `<span class="coin-badge cb img"><img src="/_blob/${esc(icon)}" alt="" loading="lazy"></span>`;
  const k = coinKey(sym), st = COIN_STYLE[k];
  const bg = st ? st[0] : `var(${COIN_COLORS[(i || 0) % COIN_COLORS.length]})`;
  const g = st ? st[1] : (k[0] || "?");
  return `<span class="coin-badge cb" style="background:${bg}" title="${esc(sym)}">${esc(g)}</span>`;
}

const coinColor = (sym, i) => { const st = COIN_STYLE[coinKey(sym)]; return st ? st[0] : `var(${COIN_COLORS[Math.max(i, 0) % COIN_COLORS.length]})`; };
/* ---------- calendar + recap ---------- */
function calHead(){
  const yr = S.calMode === "year";
  return `<div class="ph"><div><h1 data-jp="カレンダー" data-cn="日历">Calendar</h1><p>${yr ? "Your year at a glance." : "Spending by day, paydays and bill due dates."}</p></div><div class="row-btns"><div class="mini-seg wide" role="group" aria-label="View"><button data-act="calmode" data-v="month" aria-pressed="${!yr}">Month</button><button data-act="calmode" data-v="year" aria-pressed="${yr}">Year</button></div>${yr ? `<div class="mnav"><button data-act="yprev" aria-label="Previous year">‹</button><span>${S.month.slice(0,4)}</span><button data-act="ynext" aria-label="Next year">›</button></div>` : mnav()}</div></div>`;
}
function vCalendar(){
  if (S.calMode === "year") return calHead() + (dhOn() ? dhCalBanner(S.month, monthStats(S.month)) : "") + vYear();
  const k = S.month, n = daysIn(k), st = monthStats(k);
  const first = new Date(k + "-01T00:00:00"); const lead = (first.getDay() + 6) % 7;
  const byDay = {}; for (const t of allTx()) if (mkey(t.date) === k) (byDay[t.date] = byDay[t.date] || []).push(t);
  const spend = d => (byDay[d] || []).filter(t => t.type === "out").reduce((s,t) => s + t.amt, 0);
  const max = Math.max(1, ...Array.from({length:n}, (_, i) => spend(`${k}-${pad(i+1)}`)));
  const billsOn = {}; for (const b of st.bills) for (const d of b.dates) (billsOn[d] = billsOn[d] || []).push(b);
  const t0 = today();
  if (!S.calDay || mkey(S.calDay) !== k) S.calDay = mkey(t0) === k ? t0 : `${k}-01`;
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span class="cd blank"></span>');
  for (let i = 1; i <= n; i++) {
    const d = `${k}-${pad(i)}`, s = spend(d), heat = s ? 0.1 + 0.5 * (s / max) : 0;
    const inc = (byDay[d] || []).some(t => t.type === "in"), bl = billsOn[d] || [];
    cells.push(`<button class="cd ${d === t0 ? "today" : ""} ${d === S.calDay ? "sel" : ""}" data-act="calday" data-d="${d}" style="${heat ? `background:color-mix(in srgb,var(--accent) ${Math.round(heat*100)}%,var(--surface-2))` : ""}" aria-label="${fmtDate(d)}${s ? ", spent " + idrR(s) : ""}">
      <span class="cdn">${i}</span>
      <span class="cdm">${inc ? '<i class="mk inc" title="Income"></i>' : ""}${bl.map(b => `<i class="mk bill ${b.paidCount >= b.dates.indexOf(d) + 1 ? "paid" : ""}" title="${esc(b.name)}"></i>`).join("")}</span>
      ${s ? `<span class="cda num">${idrS(s)}</span>` : ""}
    </button>`);
  }
  const sel = S.calDay, dayTx = byDay[sel] || [], dayBills = billsOn[sel] || [];
  const dOut = dayTx.filter(t => t.type === "out").reduce((s,t) => s + t.amt, 0);
  return `
  ${calHead()}
  ${dhOn() ? dhCalBanner(k, st) : ""}
  <div class="g">
    <section class="card d8">
      <div class="card-h"><h2>${mLabel(k)}</h2><div class="cal-legend"><span><i class="mk inc"></i>Income</span><span><i class="mk bill"></i>Bill due</span><span><i class="mk bill paid"></i>Bill paid</span><span><i class="heat"></i>More spending</span></div></div>
      <div class="cal-h">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x => `<span>${x}</span>`).join("")}</div>
      <div class="cal">${cells.join("")}</div>
    </section>
    <div class="d4 stack">
      <section class="card">
        <div class="card-h"><h2>${new Date(sel + "T00:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}</h2><button class="btn ghost sm" data-act="caladd" data-d="${sel}">Add</button></div>
        ${dayBills.length ? `<div class="rows" style="margin-bottom:8px">${dayBills.map(b => `<div class="row" style="grid-template-columns:34px minmax(0,1fr) auto">${tagIco(b.tag || "Subscriptions")}<span style="min-width:0"><span class="t" style="display:block">${esc(b.name)}</span><span class="s" style="display:block">Bill due · ≈ ${idr(b.per)}</span></span><span class="a">${b.unpaidN ? `<button class="link" data-act="paybill" data-id="${esc(b.id)}">Mark paid</button>` : '<span class="pos" style="font-size:.8rem;font-weight:700">Paid</span>'}</span></div>`).join("")}</div>` : ""}
        ${dayTx.length ? `<div class="rows">${dayTx.map(txRow).join("")}</div><div class="sum-row" style="border-bottom:0;margin-top:4px"><span class="muted">Spent this day</span><b class="num">${idr(dOut)}</b></div>` : (dayBills.length ? "" : '<p class="hint">Nothing logged on this day.</p>')}
      </section>
      ${recapCard(k)}
    </div>
  </div>`;
}
function recapCard(k){
  const cur = monthStats(k), prev = monthStats(mShift(k, -1));
  const pct = (a, b) => b ? Math.round((a - b) / b * 100) : null;
  const delta = (a, b, goodDown) => { const p = pct(a, b); if (p == null) return a ? '<span class="dl muted">new</span>' : ""; if (p === 0) return '<span class="dl muted">same</span>'; const up = p > 0; return `<span class="dl ${up === goodDown ? "neg" : "pos"}">${up ? "▲" : "▼"} ${Math.abs(p)}%</span>`; };
  const cats = Object.entries(cur.byTag).sort((a,b) => b[1]-a[1]).slice(0, 5);
  const top = allTx().filter(t => t.type === "out" && mkey(t.date) === k).sort((a,b) => b.amt - a.amt).slice(0, 3);
  const saved = cur.inc - cur.out;
  return `<section class="card">
    <div class="card-h"><h2>${MONTHS[+k.slice(5)-1]} recap</h2><span class="sub">vs ${MONTHS[+mShift(k,-1).slice(5)-1]}</span></div>
    ${!cur.out && !cur.inc ? '<p class="hint">Nothing logged this month yet.</p>' : `
    <div class="sum">
      <div class="sum-row"><span class="muted">Spent</span><span><b class="num">${idr(cur.out)}</b> ${delta(cur.out, prev.out, true)}</span></div>
      <div class="sum-row"><span class="muted">Income</span><span><b class="num pos">${idr(cur.inc)}</b></span></div>
      <div class="sum-row"><span class="muted">Saved</span><span><b class="num ${saved < 0 ? "neg" : ""}">${idr(saved)}</b> ${cur.target ? `<span class="dl ${saved >= cur.target ? "pos" : "muted"}">${saved >= cur.target ? "✓ target" : Math.round(Math.max(saved,0) / cur.target * 100) + "% of target"}</span>` : ""}</span></div>
    </div>
    ${cats.length ? `<div class="lbl" style="margin:16px 0 8px">By category</div><div class="rc">${cats.map(([t, v]) => `<button class="rcr" data-act="filtertag" data-tag="${esc(t)}"><span class="dot" style="background:${col(t)}"></span><span class="dn">${esc(t)}</span><b class="num">${idrS(v)}</b>${delta(v, prev.byTag[t] || 0, true)}</button>`).join("")}</div>` : ""}
    ${top.length ? `<div class="lbl" style="margin:16px 0 8px">Biggest purchases</div><div class="rc">${top.map(t => `<button class="rcr" data-act="edit" data-id="${esc(t.id)}"><span class="dot" style="background:${col(t.tag)}"></span><span class="dn">${esc(t.note || t.tag)}</span><b class="num">${idrS(t.amt)}</b><span class="dl muted">${+t.date.slice(8)} ${MONTHS[+t.date.slice(5,7)-1]}</span></button>`).join("")}</div>` : ""}`}
  </section>`;
}

/* ---------- quick add many + receipt scan ---------- */
function parseQuick(text){
  return String(text || "").replace(/(\d),(?=\d)/g, "$1\u0001").split(/[,\n;]+/).map(s => s.replace(/\u0001/g, ",").trim()).filter(Boolean).map(s => {
    const re = /(\d[\d.,]*\s*(?:k|rb|ribu|jt|juta)?)(?!.*\d)/i, m = s.match(re);
    const amt = m ? parseAmt(m[1]) : 0;
    const note = (m ? (s.slice(0, m.index) + s.slice(m.index + m[0].length)) : s).replace(/\b(rp|idr)\b/ig, "").replace(/\s+/g, " ").trim();
    return {note: note || "Item", amt};
  }).filter(x => x.amt > 0);
}
function quickSheet(text, opts = {}){
  const m = metaV();
  openSheet(opts.title || "Quick add", `<form class="form" id="qf" novalidate>
    <label>One item per comma or line<textarea class="field" id="qT" rows="4" placeholder="ayam geprek 25k, grab 18k, kopi 28rb">${esc(text || "")}</textarea></label>
    ${opts.receipt ? `<div class="icon-row"><img src="/_blob/${esc(opts.receipt)}" alt="" style="width:40px;height:40px;object-fit:cover;border-radius:6px"><span class="hint" style="flex:1">Receipt photo will be attached to these entries</span></div>` : ""}
    ${opts.total ? `<button type="button" class="chip" id="qTot" style="align-self:flex-start">Use total only · ${esc(opts.merchant || "Receipt")} ${idrR(opts.total)}</button>` : ""}
    <div id="qP"></div>
    <div class="two-col">
      <label>Wallet<select class="field" id="qW">${m.wallets.map(w => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join("")}</select></label>
      <label>Date<input class="field" type="date" id="qD" value="${opts.date || today()}"></label>
    </div>
    <button class="btn pink" type="submit" id="qS">Add entries</button>
  </form>`, root => {
    const ta = $("#qT", root);
    const paint = () => {
      const items = parseQuick(ta.value);
      const sum = items.reduce((s,x) => s + x.amt, 0);
      $("#qP", root).innerHTML = items.length ? `<div class="rows">${items.map(x => { const c = classify(x.note, "out"); return `<div class="row" style="grid-template-columns:minmax(0,1fr) auto auto;padding:7px 2px"><span class="t">${esc(x.note)}</span><span class="tag" style="font-size:.76rem">${c ? `<span class="dot" style="background:${col(c.tag)}"></span>${esc(c.tag)}` : `<span class="muted">${metaV().aiTag && S.sample ? "Claude picks" : "Other"}</span>`}</span><span class="a num">${idrR(x.amt)}</span></div>`; }).join("")}</div><div class="sum-row" style="border-bottom:0"><span class="muted">${items.length} entr${items.length === 1 ? "y" : "ies"}</span><b class="num">${idrR(sum)}</b></div>` : '<p class="hint">Type items like <b>ayam 25k, grab 18k</b>. Each needs an amount.</p>';
      $("#qS", root).textContent = items.length ? `Add ${items.length} entr${items.length === 1 ? "y" : "ies"}` : "Add entries";
    };
    ta.addEventListener("input", paint); paint(); setTimeout(() => ta.focus(), 60);
    if (opts.total) $("#qTot", root).onclick = () => { ta.value = `${opts.merchant || "Receipt"} ${opts.total}`; paint(); };
    $("#qf", root).addEventListener("submit", async e => {
      e.preventDefault();
      const items = parseQuick(ta.value); if (!items.length) { ta.focus(); return; }
      const btn = $("#qS", root); btn.disabled = true; btn.textContent = "Saving…";
      const wallet = $("#qW", root).value, date = $("#qD", root).value || today();
      let i = 0;
      for (const x of items) {
        let tag = classify(x.note, "out")?.tag;
        if (!tag) { tag = await aiTag(x.note, "out"); if (tag) learn(x.note, "out", tag); }
        const id = uid("t");
        queue({k:"tx", id, data:{id, type:"out", amt:x.amt, note:x.note.slice(0,140), tag: tag || "Other", wallet, date, ts: Date.now() + (i++), ...(opts.receipt ? {receipt: opts.receipt} : {})}});
      }
      closeSheet(); toast(`Added ${items.length} entr${items.length === 1 ? "y" : "ies"}`);
    });
  });
}
async function shrinkImage(file){
  try {
    const bmp = await createImageBitmap(file); const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(b => r(b || file), "image/jpeg", 0.85));
  } catch { return file; }
}
function scanReceipt(){
  if (!S.sample) { toast("Receipt reading needs Claude (turn on 'Use Claude' for this page)"); return; }
  closeSheet();
  openSheet("Scan receipt", `<div class="scan-pick">
      <label class="scan-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg><b>Take photo</b><span>Opens your camera</span><input type="file" id="scCam" accept="image/*" capture="environment" hidden></label>
      <label class="scan-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><b>From gallery</b><span>Pick a saved photo</span><input type="file" id="scGal" accept="image/*" hidden></label>
    </div>
    <p class="hint" style="margin-top:12px">Claude reads the items, prices and date, then you check them before saving. Uses a little of your Claude usage per receipt.</p>`, root => {
    const go = inp => inp.addEventListener("change", () => { const f = inp.files && inp.files[0]; if (f) readReceipt(f); });
    go($("#scCam", root)); go($("#scGal", root));
  });
}
async function readReceipt(f){
  let lim = null; try { lim = await S.sample.limits(); } catch {}
  if (lim && !lim.images) { closeSheet(); toast("Receipt reading isn't available in this view"); return; }
  closeSheet();
  openSheet("Reading receipt…", '<div class="empty" style="min-height:160px"><span class="mascot">' + mascotSVG("ok") + '</span><span>Claude is reading your receipt. This takes a few seconds.</span></div>');
  try {
    const img = await shrinkImage(f);
    const rcP = uploadReceipt(img);
    const r = await S.sample.json(`Read this shop receipt (likely Indonesian). Return ONLY JSON: {"merchant": string, "date": "YYYY-MM-DD" or null, "items": [{"name": string, "amount": number}], "total": number}. Amounts are integers in Rupiah after item discounts. Put tax/service/fees in "total" but not in "items". Keep item names short (max 4 words).`, {images: img, modelTier: "default"});
    const items = Array.isArray(r && r.items) ? r.items.filter(x => x && +x.amount > 0).slice(0, 15) : [];
    const total = Math.round(+(r && r.total) || items.reduce((s,x) => s + +x.amount, 0));
    const date = r && /^\d{4}-\d{2}-\d{2}$/.test(r.date || "") && r.date <= today() ? r.date : today();
    const text = items.length ? items.map(x => `${String(x.name).replace(/[,;\n]/g, " ").trim()} ${Math.round(+x.amount)}`).join("\n") : (total ? `${(r && r.merchant) || "Receipt"} ${total}` : "");
    closeSheet();
    if (!text) { toast("Couldn't find amounts on that photo. Try a clearer picture."); return; }
    const receipt = await rcP;
    quickSheet(text, {title: "Receipt" + (r.merchant ? " · " + r.merchant : ""), total: items.length > 1 ? total : 0, merchant: r.merchant, date, receipt});
  } catch (e) {
    closeSheet();
    toast(e && e.code === "not_granted" ? "Allow 'Use Claude' for this page to read receipts" : e && e.code === "rate_limited" ? "Too many requests. Try again in a minute." : "Couldn't read that receipt. Try again or type it in.");
  }
}

/* ---------- crypto deposit ---------- */
function depSheet(){
  const c = structuredClone(cryptoV()), m = metaV(), rate = m.rate || 0;
  openSheet("Deposit to crypto", `<form class="form" id="df" novalidate>
    <label>Amount (USDT)<input class="field amt-in num" id="dA" inputmode="decimal" placeholder="100"></label>
    <div class="hint num" id="dH" style="margin-top:-8px">Adds to your USDT and to your capital, so break-even stays correct.</div>
    <div class="two-col"><label>Date<input class="field" type="date" id="dD" value="${today()}"></label><label>Note<input class="field" id="dN" placeholder="BCA → Indodax" maxlength="40"></label></div>
    <label class="switch" style="font-size:.85rem">Taken from a bank wallet<input type="checkbox" id="dB"></label>
    <div id="dBank" hidden class="two-col"><label>From<select class="field" id="dW">${m.wallets.map(w => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join("")}</select></label><label>Amount sent (Rp)<input class="field num" id="dR" inputmode="decimal"></label></div>
    <p class="hint" id="dBH" hidden>Moves money out of that wallet as a transfer, not spending.</p>
    <button class="btn pink" type="submit">Deposit</button>
  </form>`, root => {
    const upd = () => {
      const a = nz($("#dA",root).value), on = $("#dB",root).checked;
      $("#dH",root).textContent = a ? `≈ ${idrR(a * rate)} · USDT after: ${usdRaw((+c.cash||0) + a)}` : "Adds to your USDT and to your capital, so break-even stays correct.";
      $("#dBank",root).hidden = !on; $("#dBH",root).hidden = !on;
      if (on && !$("#dR",root).dataset.touched) $("#dR",root).value = a ? Math.round(a * rate).toLocaleString("id-ID") : "";
    };
    root.addEventListener("input", e => { if (e.target.id === "dR") e.target.dataset.touched = 1; upd(); }); root.addEventListener("change", upd);
    setTimeout(() => $("#dA",root).focus(), 60);
    $("#df",root).addEventListener("submit", e => { e.preventDefault();
      const a = nz($("#dA",root).value); if (!a || a <= 0) { $("#dA",root).focus(); return; }
      const date = $("#dD",root).value || today(), rec = {id: uid("d"), date, amt: a, note: $("#dN",root).value.trim().slice(0,40)};
      if ($("#dB",root).checked) { const r = parseAmt($("#dR",root).value) || Math.round(a * rate); rec.idr = r; rec.tx = uid("t");
        queue({k:"tx", id: rec.tx, data:{id: rec.tx, type:"tr", amt:r, note:"Crypto deposit" + (rec.note ? " · " + rec.note : ""), tag:"Transfer", wallet:$("#dW",root).value, to:"crypto", date, ts: Date.now()}}); }
      c.cash = +(((+c.cash || 0) + a).toFixed(8)); c.dep = [...(c.dep || []), rec];
      queue({k:"crypto", data:c}); closeSheet(); toast("Deposit logged");
    });
  });
}

/* ---------- own coin icons (assets) ---------- */
function iconPicker(id, sym, icon){

  const known = Object.keys(hist).sort(); let last = null;

function dhPr(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const dhF = p => p[0].toFixed(1) + " " + p[1].toFixed(1);
/* mirror an absolute-coordinate path (M/L/C/Q/S/Z only) around x = 200 */
function dhMir(d){ let i = 0; return d.replace(/-?\d*\.?\d+/g, n => (i++ % 2 === 0) ? String(+(400 - +n).toFixed(1)) : n); }

    const dx = 3*m*m*(P[2]-P[0]) + 6*m*t*(P[4]-P[2]) + 3*t*t*(P[6]-P[4]);
    const dy = 3*m*m*(P[3]-P[1]) + 6*m*t*(P[5]-P[3]) + 3*t*t*(P[7]-P[5]);

/* ---------- DONGHUA scenes: one living world per chapter, composed for the actual viewport ---------- */
function dhRand(seed){ return dhPr(seed); }
/* karst pinnacle ridge (Zhangjiajie-like) */
function dhRidge(seed, W, base, minH, maxH, n, H){
  const r = dhRand(seed); let d = `M0 ${base}`; const step = W / n; H = H || base + 600;
  for (let i = 0; i < n; i++) {
    const x0 = i * step, w = step * (0.55 + r() * 0.4), x = x0 + (step - w) / 2, h = minH + r() * (maxH - minH), top = base - h, c = w * 0.18;
    d += ` L${x.toFixed(1)} ${base} C${(x + c * .2).toFixed(1)} ${(base - h * .55).toFixed(1)}, ${(x + c * .4).toFixed(1)} ${(top + 14).toFixed(1)}, ${(x + w * .32).toFixed(1)} ${(top + 4).toFixed(1)} C${(x + w * .45).toFixed(1)} ${(top - 6).toFixed(1)}, ${(x + w * .62).toFixed(1)} ${(top - 4).toFixed(1)}, ${(x + w * .7).toFixed(1)} ${(top + 6).toFixed(1)} C${(x + w - c * .4).toFixed(1)} ${(top + 18).toFixed(1)}, ${(x + w - c * .2).toFixed(1)} ${(base - h * .5).toFixed(1)}, ${(x + w).toFixed(1)} ${base}`;
  }
  return d + ` L${W} ${base} L${W} ${H} L0 ${H} Z`;
}
/* soft rolling hills */
function dhHills(seed, W, base, amp, n, H){
  const r = dhRand(seed); let d = `M0 ${base}`; const step = W / n;
  for (let i = 0; i < n; i++) { const x1 = i * step + step / 2, x2 = (i + 1) * step, y = base - amp * (.4 + r() * .6); d += ` Q${x1.toFixed(0)} ${y.toFixed(0)} ${x2.toFixed(0)} ${(base - r() * amp * .25).toFixed(0)}`; }
  return d + ` L${W} ${H} L0 ${H} Z`;
}
const dhV = (id, a, b, c) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c || b}"/></linearGradient>`;
const dhFade = (id, col, o1, o2) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity="${o1}"/><stop offset="1" stop-color="${col}" stop-opacity="${o2 ?? 0}"/></linearGradient>`;
const dhRad = (id, col, o) => `<radialGradient id="${id}"><stop offset="0" stop-color="${col}" stop-opacity="${o ?? 1}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>`;
function dhStars(seed, W, Hm, n, col){ const r = dhRand(seed); let s = ""; for (let i = 0; i < n; i++) { s += `<circle cx="${(r() * W).toFixed(0)}" cy="${(r() * Hm).toFixed(0)}" r="${(r() * 1.3 + .3).toFixed(1)}" opacity="${(r() * .7 + .2).toFixed(2)}"/>`; } return `<g fill="${col}">${s}</g>`; }
function dhMist(id, items, col, op){ return items.map(([x, y, rx, ry], i) => `<ellipse class="dh-mistE" style="animation-delay:${-i * 7}s" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#${id})" opacity="${op}"/>`).join(""); }

/* painted trinkets inside scene svgs */
const dhFxOk = k => typeof DH_FX !== "undefined" && DH_FX[k];
function dhMoonImg(cx, cy, rr, op){ if (!dhFxOk("moon")) return `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="#fbf1d6"/>`; const w = rr / .413, h = w * 371 / 380; return `<image href="${DH_FX.moon}" x="${(cx - w / 2).toFixed(1)}" y="${(cy - h * .507).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" opacity="${op ?? 1}"/>`; }
/* smooth ink-wash mountain range (Chinese landscape painting style) */
function dhInkRange(seed, W, base, amp, n, H){
  const r = dhRand(seed), pts = [[-60, base - amp * .1]];
  for (let i = 0; i < n; i++) {
    const cx = (i + .5) / n * W + (r() - .5) * W / n * .35, top = base - amp * (.5 + r() * .5), sw = W / n * (.16 + r() * .1);
    pts.push([cx - W / n * .42, base - amp * (.05 + r() * .18)], [cx - sw, top + amp * (.18 + r() * .1)], [cx, top], [cx + sw * .8, top + amp * (.14 + r() * .12)]);
  }
  pts.push([W + 60, base - amp * .1]);
  let d = `M-60 ${H} L${pts[0][0]} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2; d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; }
  return d + `L${W + 60} ${H} Z`;
}

function dhMoonPhase(cx, cy, R, f, dark){
  f = Math.max(0, Math.min(1, f));

/* bamboo stalk with nodes and leaf sprays */
function dhBamboo(x, top, bot, w, col, seed, leaves, lean){
  const r = dhRand(seed); let g = ""; const segs = Math.max(3, Math.round((bot - top) / (w * 9)));
  const sh = (bot - top) / segs; lean = lean || 0;
  for (let i = 0; i < segs; i++) { const y0 = top + i * sh, x0 = x + lean * (1 - (y0 - top) / (bot - top)); g += `<rect x="${(x0 - w / 2).toFixed(1)}" y="${y0.toFixed(1)}" width="${w}" height="${(sh - 2).toFixed(1)}" rx="${w / 3}"/>`; }
  let lv = "";
  for (let i = 0; i < leaves; i++) {
    const y = top + (r() * .7) * (bot - top), sgn = r() > .5 ? 1 : -1, x0 = x + lean * (1 - (y - top) / (bot - top));
    for (let j = 0; j < 3; j++) { const len = w * (5 + r() * 4), ang = sgn * (20 + j * 18 + r() * 10); lv += `<path d="M0 0 C ${len * .3} ${-w * .6}, ${len * .7} ${-w * .5}, ${len} 0 C ${len * .7} ${w * .4}, ${len * .3} ${w * .5}, 0 0 Z" transform="translate(${x0.toFixed(1)} ${y.toFixed(1)}) rotate(${(sgn > 0 ? ang : 180 + ang).toFixed(0)})"/>`; }
  }
  return `<g fill="${col}">${g}${lv}</g>`;
}

    const tri = ["☰", "☱", "☲", "☳", "☴", "☵", "☶", "☷"]; let ring = "";

/* ---------- chapter II: calendar ---------- */
function dhCalBanner(k, st){

  const n = daysIn(k), days = dhSpendDays(k), per = dhPer(st, k), cur = mkey(today()), td = k === cur ? +today().slice(8) : k < cur ? n : 0;
  let on = 0, off = 0, bl = "", path = "";

  for (let i = 1; i <= n; i++) {
    const x = (i - .5) / n * 100, st2 = i > td ? "bud" : (st.inc > 0 && days[i - 1] <= per ? "on" : "off");
    if (st2 === "on") on++; else if (st2 === "off") off++;

    </div>

}

/* ---------- living background ---------- */

  const cv = document.createElement("canvas"); cv.className = "dh-fx"; cv.setAttribute("aria-hidden", "true");
  document.body.prepend(cv); document.body.prepend(bg);
  const side = document.querySelector(".side .side-foot");
  if (side) { const d = document.createElement("div"); d.className = "dh-side"; d.setAttribute("aria-hidden", "true"); side.before(d); }
  document.querySelectorAll(".brand").forEach(b => { if (!b.querySelector(".dh-seal-mini")) { const s = document.createElement("button"); s.className = "dh-seal-mini"; s.type = "button"; s.dataset.egg = "fortune"; s.setAttribute("aria-label", "Draw today's fortune"); s.textContent = "灵账"; b.appendChild(s); } });
  document.addEventListener("pointerdown", e => {
    if (!isDH()) return;
    if (!dhReduce()) { const r = document.createElement("span"); r.className = "dh-ripple"; r.style.left = e.clientX + "px"; r.style.top = e.clientY + "px"; document.body.appendChild(r); setTimeout(() => r.remove(), 700); }

  }, {passive: true});
  const cancel = () => clearTimeout(DH.press);

  document.addEventListener("click", e => { if (!isDH()) return; const el = e.target.closest("[data-egg]"); if (el) { e.preventDefault(); dhEgg(el.dataset.egg, el, e); } });
  document.addEventListener("contextmenu", e => { if (isDH() && e.target.closest("[data-egg='girl']")) e.preventDefault(); });
  document.addEventListener("keydown", e => {
    if (!isDH() || (e.target && e.target.closest && e.target.closest("input,textarea,select,[contenteditable]"))) return;

    else if (DH.buf.endsWith("888")) { DH.buf = ""; dhFind("lucky"); dhGoldRain(); }
  });
  addEventListener("scroll", dhParallax, {passive: true});
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (!isDH()) return; dhScene2(); dhFxResize(); }, 180); });
  new MutationObserver(() => { if (isDH()) { dhScene2(); DHFX.col = null; if (DHFX.on) dhFxSeed(); } }).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme", "data-accent"]});
}
function dhScene2(){
  const bg = document.querySelector(".dh-bg"); if (!bg) return;
  const tab = S.tab, dark = dhDark(), season = DH.season || dhSeasonOf(S.month);
  const W = Math.max(300, Math.round(1000 * innerWidth / Math.max(1, innerHeight)));
  const key = [tab, tab === "cal" ? season : "", dark, Math.round(W / 50)].join("|");
  if (key === DH.key) return; DH.key = key;
  const n = ++DH.sceneN, layers = dhScene(tab, W, dark, season);
  const sp = layers.spin;
  let html = layers.map((l, i) => l ? `<div class="dh-L" data-i="${i}"><div class="dh-La"><svg viewBox="0 0 ${W} 1300" preserveAspectRatio="xMidYMin slice">${l}</svg></div></div>`
    : sp ? `<div class="dh-L" data-i="${i}"><div class="dh-La"><svg class="dh-spin" viewBox="${(sp.x - sp.r).toFixed(0)} ${(sp.y - sp.r).toFixed(0)} ${(2 * sp.r).toFixed(0)} ${(2 * sp.r).toFixed(0)}" style="position:absolute;left:${((sp.x - sp.r) / W * 100).toFixed(2)}%;top:${((sp.y - sp.r) / 1300 * 100).toFixed(2)}%;width:${(2 * sp.r / W * 100).toFixed(2)}%;height:${(2 * sp.r / 1300 * 100).toFixed(2)}%">${sp.svg}</svg></div></div>` : "").join("");
  html = html.replace(/id="([^"]+)"/g, `id="z${n}$1"`).replace(/url\(#([^)]+)\)/g, `url(#z${n}$1)`);
  const sc = document.createElement("div"); sc.className = "dh-scene"; sc.dataset.scene = tab; sc.innerHTML = html;
  const old = [...bg.querySelectorAll(".dh-scene")];
  bg.appendChild(sc); dhParallax();
  if (old.length && !dhReduce()) { requestAnimationFrame(() => requestAnimationFrame(() => sc.classList.add("on"))); setTimeout(() => old.forEach(o => o.remove()), 900); }
  else { sc.classList.add("on"); old.forEach(o => o.remove()); }
}
let dhPx = 0;
function dhParallax(){
  if (dhPx || !isDH()) return;
  dhPx = requestAnimationFrame(() => {
    dhPx = 0; const max = Math.max(1, document.documentElement.scrollHeight - innerHeight), p = Math.min(1, Math.max(0, scrollY / max)), H = innerHeight * 1.3;
    const bg = document.querySelector(".dh-bg"); if (!bg) return;
    if (dhReduce()) return;
    bg.querySelectorAll(".dh-L").forEach(l => { const d = [0, 0, .12, .22][+l.dataset.i] || 0; if (d) l.style.transform = `translate3d(0,${(-p * d * H).toFixed(1)}px,0)`; });
  });
}

/* each chapter's weather, drawn with the painted trinket sprites */
const dhFxModes = () => ({

function dhFxResize(){ const cv = document.querySelector(".dh-fx"); if (!cv) return; DHFX.dpr = Math.min(devicePixelRatio || 1, 1.5); DHFX.w = innerWidth; DHFX.h = innerHeight; cv.width = DHFX.w * DHFX.dpr; cv.height = DHFX.h * DHFX.dpr; dhFxSeed(); }
const DH_GLYPHS = "财福禄寿金玉灵吉祥运".split("");
const DH_FALL = {petal: [14, 22], plum: [14, 22], maple: [18, 30], ginkgo: [16, 26], bamboo: [18, 30], lotus: [16, 24], snow: [8, 18], coin: [16, 24], ingot: [22, 32]};
const DH_RISE = {skylan: [20, 36], bokeh: [18, 40], firefly: [16, 28], qic: [40, 74], qip: [40, 74], star: [10, 22]};
const DH_ADD = {bokeh: 1, firefly: 1, qic: 1, qip: 1, star: 1, sparks: 1, skylan: 1};
function dhPart(k, any){
  const W = DHFX.w, H = DHFX.h, R = Math.random, rng = ([a, b]) => a + R() * (b - a);

  if (DH_FALL[k]) Object.assign(p, {s: rng(DH_FALL[k]), y: any ? R() * H : -30, va: (R() - .5) * .03, vx: k === "snow" ? (R() - .5) * .3 : .15 + R() * .55, vy: (k === "snow" ? .3 : .4) + R() * .6, fs: .015 + R() * .03});
  else if (k === "firefly") Object.assign(p, {s: rng(DH_RISE.firefly), y: R() * H, vx: (R() - .5) * .4, vy: (R() - .5) * .4});

function cleanMeta(m){

  const id = e.target.id;
  if (id === "fm") { S.f.month = e.target.value; render(); }
  else if (id === "fc") { S.f.tag = e.target.value; render(); }
  else if (id === "fw") { S.f.wallet = e.target.value; render(); }
  else if (id === "ft") { S.f.type = e.target.value; render(); }
  else if (id === "hideOpen") { const m = structuredClone(metaV()); m.hideOnOpen = e.target.checked; lsSet("ll_hideopen", e.target.checked); if (e.target.checked) { S.hide = true; lsSet("ll_hide", true); } queue({k:"meta", data:m}); }
  else if (id === "aiT") { const m = structuredClone(metaV()); m.aiTag = e.target.checked; queue({k:"meta", data:m}); }
  else if (id === "imp" && e.target.files[0]) doImport(e.target.files[0]);
});

/* ---------- boot ---------- */
render();
(async () => {
  const cl = window.claude;
  if (!cl || !cl.use) { S.mode = "device"; render(); return; }
  cl.use("sample").then(s => { S.sample = s; }).catch(() => {});
  cl.use("assets").then(a => { S.assets = a; }).catch(() => {});
  cl.use("mcp").then(m => { S.mcp = m; render(); }).catch(() => {});
  cl.use("downloads").then(d => { S.downloads = d; }).catch(() => {});
  const db = await cl.use("db").catch(() => null);
  if (!db) { S.mode = "device"; render(); return; }
  S.db = db; S.mode = "cloud";
  acctWatch(); subscribeProfile();
  render(); flush();
})();
})();
